# In-cluster mock backend for PoD 1.1 (app-to-app through the gateway inside one cluster). Same manifests in both clusters.
# mock.py is a copy of mocks/mock.py (kustomize cannot read outside its directory); keep them identical.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources: [mock.yaml, proxy.yaml]
generatorOptions: {disableNameSuffixHash: true}
configMapGenerator:
  - name: mock-py
    files: [mock.py]
  - name: proxy-py
    files: [proxy.py]
