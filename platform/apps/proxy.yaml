# Logging forward proxy for PoD 1.6 (the gateway runtime's HTTPS_PROXY). Not for production use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  labels: {app: proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app: proxy}}
  template:
    metadata: {labels: {app: proxy}}
    spec:
      nodeSelector: {agentpool: work}
      containers:
        - name: proxy
          image: python:3.12.7-slim
          command: [python3, -u, /opt/proxy/proxy.py, "3128"]
          ports: [{containerPort: 3128}]
          volumeMounts: [{name: proxy-py, mountPath: /opt/proxy}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 64Mi}}
      volumes:
        - name: proxy-py
          configMap: {name: proxy-py}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  selector: {app: proxy}
  ports: [{port: 3128, targetPort: 3128}]
