# In-cluster mock backend (namespace apps) for PoD 1.1; manifests shared by both regions.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MinuraKariyawasam/alior-poc.git
    targetRevision: main
    path: platform/apps
  destination: {server: https://kubernetes.default.svc, namespace: apps}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
