# ingress-nginx 4.15.1 on the static IP pod-a-ingress-ip (DNS label pod-a-alior). TLS terminates here with
# Let's Encrypt certificates from cert-manager; Front Door uses the cloudapp name as an HTTPS origin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          replicaCount: 1
          nodeSelector: {agentpool: work}
          admissionWebhooks:
            enabled: false               # Argo CD reverts the caBundle the chart's patch job sets, so the webhook rejects every Ingress; it only validates syntax
          service:
            annotations:
              service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-Alior-POC-minura
              service.beta.kubernetes.io/azure-pip-name: pod-a-ingress-ip
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
        defaultBackend: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: ingress-nginx}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
