# Region a overrides on top of values.yaml: Argo CD served under https://pod-cp-eccmfmahgkevcqcy.a02.azurefd.net/argocd through Front Door.
# The ingress rule matches the Front Door host (sent as the origin host header); the origin certificate for
# pod-a-alior.polandcentral.cloudapp.azure.com comes from platform/ingress/region-a/origin-tls.yaml, matched by SNI.
configs:
  params:
    server.insecure: "true"
    server.rootpath: /argocd
    server.basehref: /argocd
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: pod-cp-eccmfmahgkevcqcy.a02.azurefd.net
    path: /argocd
    pathType: Prefix
    tls: false
