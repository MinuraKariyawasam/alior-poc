# Overlay on the operator's default gateway chart (2026.10.0 from registry.wso2.com) values for pod-a-gw. Deep-merged by the operator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-a-gw-values
  namespace: wso2-gw
data:
  values.yaml: |
    wso2:
      subscription:
        imagePullSecret: harbor-pull         # images come from registry.wso2.com (chart 2026.10.0); Secret from platform/gateway/harbor-secret.sh
    gateway:
      config:
        controller:
          controlplane:
            insecure_skip_verify: true     # the APIM control plane uses the chart's self-signed certificate
            reconnect_max: 30s             # default 5m; short so the gateway is back quickly after drills D2/D5
            gateway_name: pod-a-gw
          storage:
            type: sqlite
            sqlite:
              path: /app/data/gateway.db
          logging:
            level: info
            format: json
        policy_engine:
          metrics:
            enabled: true                  # Prometheus /metrics on :9003 (PoD 7.1); scraped by platform/observability/servicemonitors.yaml
        router:
          access_logs:
            enabled: true
            format: json
        policy_configurations:
          jwtauth_v1:
            keymanagers:                   # read by the Policy Hub jwt-auth policy: trust tokens issued by our control plane (PoD 6.11)
              - name: apim-resident
                issuer: https://am.wso2.com:443/oauth2/token
                jwks:
                  remote:
                    uri: https://apim-wso2am-all-in-one-am-service.wso2-cp.svc.cluster.local:9443/oauth2/jwks
                    skipTlsVerify: true    # the control plane runs on the chart's self-signed certificate
      controller:
        image: {repository: registry.wso2.com/wso2-api-platform/sts/gateway-controller, tag: "2026.10.0"}   # explicit: the operator's embedded defaults still pin 1.2.0
        metrics:
          enabled: true                    # Prometheus /metrics on :9091 (PoD 7.1); chart-level key, the template reads .Values.gateway.controller.metrics
        controlPlane:                    # the CR's controlPlane block did not reach the chart on 0.11.4; set the chart keys here
          host: "apim-wso2am-all-in-one-am-service.wso2-cp.svc.cluster.local:9443"
          token:
            secretName: gateway-cp-token
            key: token
        storage:
          type: sqlite
          sqlitePath: /app/data/gateway.db  # must be absolute: the container has no working directory, so ./data does not exist
        encryptionKeys:
          enabled: true                    # mandatory, fail-closed; Secret created by platform/gateway/secrets.sh
          secretName: gateway-encryption-keys
        tls:
          certManager:
            commonName: pod-a-gw
            dnsNames: [pod-a-gw, pod-a-gw.wso2-gw.svc, "*.alior-poc.local", localhost]
        persistence:
          size: 1Gi
        deployment:
          extraEnv:                        # PoD 1.6: the controller's outbound link to the control plane goes through the proxy when the host is not internal
            - {name: HTTPS_PROXY, value: http://proxy.apps.svc.cluster.local:3128}
            - {name: HTTP_PROXY, value: http://proxy.apps.svc.cluster.local:3128}
            - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local"}
          podSecurityContext:
            fsGroup: 10001                 # the image runs as uid 10001; the Azure disk mounts root-owned 755 without this and SQLite cannot create its file
          strategy:
            type: Recreate                 # the data disk is ReadWriteOnce; a rolling update would wait on the old pod forever
      gatewayRuntime:
        image: {repository: registry.wso2.com/wso2-api-platform/sts/gateway-runtime, tag: "2026.10.0"}
        service:
          type: LoadBalancer               # public IP for Front Door origins; health probes on /_gateway-health/ready
        deployment:
          replicaCount: 2                  # PoD 1.5: two runtimes per region behind the LB; the drills kill one
          extraEnv:                        # PoD 1.6: outbound HTTP proxy for the Go side (policy engine, e.g. JWKS fetch); in-cluster names bypass it.
            - {name: HTTPS_PROXY, value: http://proxy.apps.svc.cluster.local:3128}
            - {name: HTTP_PROXY, value: http://proxy.apps.svc.cluster.local:3128}
            - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local,pod-a-gw-gw-gateway-controller"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
