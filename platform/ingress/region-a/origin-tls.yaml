# Holds the Let's Encrypt certificate for the ingress's own name, which Front Door validates by SNI when it
# connects to the origin. The rule also lets the name be opened directly for troubleshooting.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origin-tls
  namespace: wso2-cp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

spec:
  ingressClassName: nginx
  tls:
    - hosts: [pod-a-alior.polandcentral.cloudapp.azure.com]
      secretName: origin-tls
  rules:
    - host: pod-a-alior.polandcentral.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apim-wso2am-all-in-one-am-service
                port:
                  number: 9443
