# Key Vault -> Kubernetes Secret "apim-secrets" in wso2-cp, consumed by the APIM chart's existingSecret keys.
# The Secret is created by the CSI driver while a pod mounts this provider class (the APIM pod does, via extraVolumes).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: apim-secrets
  namespace: wso2-cp
spec:
  provider: azure
  secretObjects:
    - secretName: apim-secrets
      type: Opaque
      data:
        - objectName: apim-admin-password
          key: adminPassword
        - objectName: pod-a-db-apim
          key: apimDBPassword
        - objectName: pod-a-db-apim
          key: sharedDBPassword
        - objectName: apim-encryption-key
          key: encryptionKey
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: b878f3a8-0190-44a1-9994-369f8c3f7791   # pod-a-aks azureKeyvaultSecretsProvider identity
    keyvaultName: pod-kv-alior
    tenantId: da76d684-740f-4d94-8717-9d5fb21dd1f9
    objects: |
      array:
        - |
          objectName: apim-admin-password
          objectType: secret
        - |
          objectName: pod-a-db-apim
          objectType: secret
        - |
          objectName: apim-encryption-key
          objectType: secret
